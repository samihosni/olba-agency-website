<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olba Agency</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #111; /* Fallback color */
        }

        /* Background Image Setup */
        .hero-section {
            /* Make sure the image file is in the same folder and named exactly like this */
            background-image: url('wallpaper olba.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* Container for the buttons */
        .social-container {
            position: absolute;
            bottom: 10%; /* Positions it in the dark empty space at the bottom */
            left: 5%;    /* Aligns it roughly with the text above */
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Button Styling */
        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn i {
            font-size: 20px;
        }

        /* WhatsApp Button Colors */
        .btn-whatsapp {
            background-color: #25D366;
        }

        /* Instagram Button Colors */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .social-container {
                bottom: 5%;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: column;
                align-items: center;
                width: 90%;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="social-container">
            <a href="https://wa.me/YOUR_NUMBER" target="_blank" class="btn btn-whatsapp">
                Contactez-nous <i class="fab fa-whatsapp"></i>
            </a>

            <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="btn btn-instagram">
                Visitez-nous <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>

</body>
</html>
