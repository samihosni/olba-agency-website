<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olba Agency</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            overflow: hidden; /* Prevents scrollbars */
        }

        /* The Hero Section using your GitHub image */
        .hero-section {
            background-image: url('wallpaper_olba.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            align-items: flex-end; /* Puts buttons at the bottom */
            justify-content: flex-start;
        }

        /* Container for the buttons */
        .social-container {
            margin-bottom: 50px;
            margin-left: 5%;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        /* Button Styling */
        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        /* WhatsApp Style */
        .btn-whatsapp {
            background-color: #25D366;
        }

        /* Instagram Style */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .social-container {
                flex-direction: column;
                bottom: 20px;
                width: 90%;
            }
            .btn {
                width: fit-content;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="social-container">
            <a href="https://wa.me/21600000000" target="_blank" class="btn btn-whatsapp">
                Contactez-nous <i class="fab fa-whatsapp"></i>
            </a>

            <a href="https://instagram.com/olba_agency" target="_blank" class="btn btn-instagram">
                Visitez-nous <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>

</body>
</html>
