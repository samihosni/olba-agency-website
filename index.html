<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OLBA Agency – Agence de création de contenu digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Outfit', sans-serif;
      background: #0a0a0a;
      overflow: hidden;
    }

    /* ── BACKGROUND IMAGE — exact, no crop ── */
    .bg-img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      z-index: 0;
    }

    /* ── SOCIAL BUTTONS — dead center of screen ── */
    .socials-center {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      z-index: 10;
      animation: fadeIn 0.9s ease 0.3s both;
    }

    .socials-label {
      font-size: 0.9rem;
      font-weight: 400;
      color: #ffffffcc;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .socials {
      display: flex;
      gap: 1.5rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-decoration: none;
      padding: 1.1rem 2.2rem;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .social-btn:hover {
      transform: translateY(-5px) scale(1.05);
    }
    .social-btn.whatsapp:hover {
      border-color: #25D366;
      background: rgba(37,211,102,0.15);
      box-shadow: 0 14px 40px rgba(37,211,102,0.3);
    }
    .social-btn.instagram:hover {
      border-color: #E1306C;
      background: rgba(225,48,108,0.15);
      box-shadow: 0 14px 40px rgba(225,48,108,0.3);
    }

    /* ── COPYRIGHT ── */
    .copyright {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: #ffffff55;
      letter-spacing: 0.08em;
      z-index: 10;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -42%); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }

    @media (max-width: 600px) {
      .socials { flex-direction: column; gap: 1rem; }
      .social-btn { font-size: 1rem; padding: 0.9rem 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- EXACT BACKGROUND IMAGE -->
  <img class="bg-img" src="wallpaper_olba.png" alt="OLBA Agency" />

  <!-- CENTERED SOCIAL BUTTONS -->

  <p class="copyright">© 2026 OLBA Agency. Tous droits réservés.</p>

</body>
</html>
